version: 2

sources:
  - name: keka_task_source
    database: workspace
    schema: tmg

    tables:
      - name: dim_task_info_bronze

        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "length(start_date) = 11 and length(end_date) = 11"

        columns:
          - name: project_code
            data_tests:
              - not_null